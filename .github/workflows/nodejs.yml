name: Node CI

on:
  push:
    branches:
      - main
      - 'v*' # prior release branches (e.g. `v0.30.x` branch)
    tags:
      - 'v*'
  pull_request:

jobs:
  discover_matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v1
      - uses: ./.github/actions/setup
      - name: eslint
        run: for name in `ls packages/*/.eslintrc.js`; do dirname $name; done  | xargs npx eslint --
      - id: set-matrix
        working-directory: test-scenarios
        run: |
          matrix_json=$(node --require ts-node/register ./suite-setup-util.ts)
          echo "matrix=$matrix_json" >> $GITHUB_OUTPUT

  scenarios:
    needs: discover_matrix
    name: ${{ matrix.name }}
    runs-on: '${{ matrix.os }}-latest'
    strategy:
      fail-fast: false
      matrix: ${{fromJson(needs.discover_matrix.outputs.matrix)}}
    steps:
      - uses: actions/checkout@v1
      - uses: ./.github/actions/setup
        with:
          use_lockfile: false
      - name: Work around windows short path alias # https://github.com/actions/runner-images/issues/712
        if: runner.os == 'Windows'
        run: new-item D:\temp -ItemType Directory; echo "TEMP=D:\temp" >> $env:GITHUB_ENV
      - name: test
        run: ${{ matrix.command }}
        working-directory: test-scenarios

  discover_matrix_legacy:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v1
      - uses: ./.github/actions/setup
      - id: set-matrix
        working-directory: test-scenarios
        env:
          ENABLE_LEGACY_SCENARIOS: true
        run: |
          matrix_json=$(node --require ts-node/register ./suite-setup-util.ts)
          echo "matrix=$matrix_json" >> $GITHUB_OUTPUT

  scenarios_legacy:
    needs: discover_matrix_legacy
    name: ${{ matrix.name }}
    runs-on: '${{ matrix.os }}-latest'
    strategy:
      fail-fast: false
      matrix: ${{fromJson(needs.discover_matrix_legacy.outputs.matrix)}}
    steps:
      - uses: actions/checkout@v1
      - name: Apply old node overrides
        run: |
          jq '
            .pnpm.overrides = (.pnpm.overrides // {}) + {
               "quick-temp": "0.1.8",
               "ember-cli-babel": "^7.0.0"
            }
          ' package.json > package.json.tmp
      - run: mv package.json.tmp package.json
      - uses: ./.github/actions/setup
        with:
          use_lockfile: false
      - name: Work around windows short path alias # https://github.com/actions/runner-images/issues/712
        if: runner.os == 'Windows'
        run: new-item D:\temp -ItemType Directory; echo "TEMP=D:\temp" >> $env:GITHUB_ENV
      - name: test
        run: ${{ matrix.command }}
        working-directory: test-scenarios

  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v1
      - uses: ./.github/actions/setup
      - name: test
        run: npm run test:node
        working-directory: packages/ember-auto-import

  # The scenario tests can't run under Babel 8 yet because ember-cli-babel
  # doesn't support it. These cover the parts of the pipeline we own: our own
  # babel plugins and the config we hand to babel-loader.
  unit_babel8:
    name: Unit Tests (Babel 8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v1
      - name: Force Babel 8
        run: |
          jq '
            .pnpm.overrides = (.pnpm.overrides // {}) + {
               "@babel/core": "^8.0.0",
               "@babel/preset-env": "^8.0.0",
               "@babel/plugin-proposal-decorators": "^8.0.0",
               "@babel/plugin-transform-class-properties": "^8.0.0",
               "@babel/plugin-transform-class-static-block": "^8.0.0",
               "@babel/plugin-transform-private-methods": "^8.0.0",
               "babel-loader": "^10.1.1"
            }
          ' package.json > package.json.tmp
      - run: mv package.json.tmp package.json
      - uses: ./.github/actions/setup
        with:
          use_lockfile: false
      # tsc also has to survive Babel 8, which ships its own types under
      # different names than @types/babel__core uses.
      - name: compile
        run: npm run compile
        working-directory: packages/ember-auto-import
      - name: test
        run: npm run test:node
        working-directory: packages/ember-auto-import
